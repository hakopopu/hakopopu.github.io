<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>ブロック崩し - スマホ対応版</title>
    <style>
        /* スマホで画面が揺れないように固定 */
        body { 
            background: #222; color: white; font-family: sans-serif; text-align: center; 
            margin: 0; padding: 10px; overflow: hidden; height: 100vh; touch-action: none;
        }
        canvas { 
            background: #111; display: block; margin: 10px auto; 
            border: 4px solid #444; border-radius: 8px; 
            max-width: 95vw; /* スマホの幅に合わせる */
            max-height: 70vh;
        }
        .stats { font-size: 18px; display: flex; justify-content: center; gap: 15px; margin-bottom: 5px; }
        .lives { color: #ff4757; font-weight: bold; }
        .item-info { font-size: 12px; color: #aaa; margin-bottom: 5px; background: rgba(255,255,255,0.05); padding: 5px; border-radius: 5px; display: inline-block; }
        .controls-guide { font-size: 12px; color: #0cf; margin-top: 5px; }
    </style>
</head>
<body>
    <div class="stats">
        <div>STG: <span id="stageNum">1</span></div>
        <div>SCORE: <span id="scoreNum">0</span></div>
        <div class="lives">LIVES: <span id="livesNum">❤️×3</span></div>
    </div>
    <div class="item-info">
        <span style="color:#0cf">青:W</span> / <span style="color:#a4f">紫:S</span> / <span style="color:#f44">赤:F</span> / <span style="color:#f8c">桃:L</span>
    </div>
    
    <canvas id="myCanvas" width="480" height="420"></canvas>

    <div class="controls-guide">
        PC：マウス・[←][→] / スマホ：スワイプ操作
    </div>

<script>
    const canvas = document.getElementById("myCanvas");
    const ctx = canvas.getContext("2d");

    // 音響システム
    const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    function playSound(freq, type, duration, volume = 0.1) {
        if (audioCtx.state === 'suspended') audioCtx.resume();
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        osc.type = type;
        osc.frequency.setValueAtTime(freq, audioCtx.currentTime);
        gain.gain.setValueAtTime(volume, audioCtx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.0001, audioCtx.currentTime + duration);
        osc.connect(gain);
        gain.connect(audioCtx.destination);
        osc.start();
        osc.stop(audioCtx.currentTime + duration);
    }

    const sounds = {
        wall: () => playSound(600, 'sine', 0.1),
        paddle: () => playSound(800, 'sine', 0.1),
        brick: () => playSound(400, 'triangle', 0.1),
        item: () => { playSound(500, 'sine', 0.1); setTimeout(()=>playSound(700, 'sine', 0.1), 50); },
        miss: () => playSound(150, 'sawtooth', 0.5, 0.05),
        oneUp: () => { playSound(1000, 'sine', 0.2); setTimeout(()=>playSound(1300, 'sine', 0.2), 100); },
        gameOver: () => {
            const melody = [300, 250, 200, 150];
            melody.forEach((freq, i) => setTimeout(() => playSound(freq, 'sawtooth', 0.6, 0.06), i * 350));
        }
    };

    const ballRadius = 8, paddleHeight = 10, defaultPaddleWidth = 75;
    const bWidth = 65, bHeight = 15, bPadding = 10, bOffsetTop = 50, bOffsetLeft = 20;
    const maxSpeed = 9;

    let stage, score, lives, x, y, dx, dy, paddleX, paddleWidth;
    let bricks = [], items = [], baseSpeed, currentStageBaseSpeed, oneUpTimer = 0;
    let isGameOver, isWin, isMiss, isWaiting, hasBonus, gameOverMusicPlayed = false;
    let rightPressed = false, leftPressed = false;

    function firstLoad() {
        stage = 1; score = 0; lives = 3; currentStageBaseSpeed = 4;
        isWaiting = true; isGameOver = isWin = isMiss = false;
        initStageData(); updateUI();
    }

    function initGame(nextStage = false) {
        if (!nextStage) { stage = 1; score = 0; lives = 3; currentStageBaseSpeed = 4; }
        else { stage++; currentStageBaseSpeed = Math.min(currentStageBaseSpeed + 0.5, 7); }
        isWaiting = false; gameOverMusicPlayed = false;
        initStageData(); items = [];
        resetBallAndPaddle();
        updateUI(); isGameOver = isWin = isMiss = false;
    }

    function resetBallAndPaddle() {
        baseSpeed = currentStageBaseSpeed;
        x = canvas.width / 2; y = canvas.height - ballRadius - paddleHeight - 25;
        dx = baseSpeed * (Math.random() > 0.5 ? 1 : -1); dy = -baseSpeed;
        paddleX = (canvas.width - paddleWidth) / 2;
        paddleWidth = defaultPaddleWidth;
    }

    function initStageData() {
        const rows = Math.min(2 + stage, 6);
        bricks = [];
        for(let c=0; c<6; c++) {
            bricks[c] = [];
            for(let r=0; r<rows; r++) bricks[c][r] = { x: 0, y: 0, status: 1, color: `hsl(${c * 40}, 70%, 50%)` };
        }
    }

    function updateGame() {
        if (rightPressed && paddleX < canvas.width - paddleWidth) paddleX += 7;
        else if (leftPressed && paddleX > 0) paddleX -= 7;

        let activeBricks = 0;
        bricks.forEach(col => col.forEach(b => {
            if(b.status == 1) {
                activeBricks++;
                if(x > b.x && x < b.x+bWidth && y > b.y && y < b.y+bHeight) {
                    dy = -dy; b.status = 0; score += 10; updateUI(); sounds.brick();
                    if (Math.random() < 0.25) spawnItem(b.x, b.y);
                }
            }
        }));

        if(activeBricks === 0 && !isWin) {
            isWin = true;
            if(Math.abs(paddleWidth - defaultPaddleWidth) > 1) { score += 500; hasBonus = true; } 
            else { hasBonus = false; }
            updateUI();
            return;
        }

        items.forEach((item, i) => {
            item.y += 1.5;
            if(item.y > canvas.height - paddleHeight - 25 && item.y < canvas.height && item.x > paddleX && item.x < paddleX + paddleWidth) {
                applyPowerUp(item.type); items.splice(i, 1); sounds.item();
            } else if(item.y > canvas.height) items.splice(i, 1);
        });

        if(x + dx > canvas.width-ballRadius || x + dx < ballRadius) { dx = -dx; sounds.wall(); }
        if(y + dy < ballRadius) { dy = -dy; sounds.wall(); }
        else if(y + dy > canvas.height - ballRadius - paddleHeight - 20) {
            if(x > paddleX && x < paddleX + paddleWidth) {
                let cp = (x - (paddleX + paddleWidth / 2)) / (paddleWidth / 2);
                let angle = cp * (Math.PI / 3);
                dx = baseSpeed * Math.sin(angle); dy = -baseSpeed * Math.cos(angle);
                y = canvas.height - ballRadius - paddleHeight - 20;
                sounds.paddle();
            } else if (y + dy > canvas.height - ballRadius) {
                lives--; updateUI();
                if(lives > 0) { sounds.miss(); isMiss = true; } 
                else { 
                    isGameOver = true; saveScore(score); 
                    if(!gameOverMusicPlayed) { sounds.gameOver(); gameOverMusicPlayed = true; }
                }
            }
        }
        x += dx; y += dy;
    }

    function spawnItem(bx, by) {
        let allTypes = [{t:'FAST',c:'#f44'},{t:'LIFE',c:'#f8c'},{t:'WIDE',c:'#0cf'},{t:'SMALL',c:'#a4f'}];
        const stageMaxLives = stage + 5;
        let availableTypes = allTypes.filter(item => {
            if (item.t === 'FAST' && baseSpeed >= maxSpeed) return false;
            if (item.t === 'WIDE' && paddleWidth > defaultPaddleWidth) return false;
            if (item.t === 'SMALL' && paddleWidth < defaultPaddleWidth) return false;
            if (item.t === 'LIFE' && lives >= stageMaxLives) return false;
            return true;
        });
        if (availableTypes.length === 0) availableTypes = [allTypes[0], allTypes[2]];
        let pick = availableTypes[Math.floor(Math.random() * availableTypes.length)];
        items.push({ x: bx + bWidth/2, y: by, type: pick.t, color: pick.c });
    }

    function applyPowerUp(type) {
        if(type === 'WIDE') paddleWidth = 120;
        else if(type === 'SMALL') paddleWidth = 40;
        else if(type === 'LIFE') { lives++; updateUI(); oneUpTimer = 100; sounds.oneUp(); }
        else if(type === 'FAST') { 
            baseSpeed = Math.min(baseSpeed + 1.0, maxSpeed); 
            let angle = Math.atan2(dx, -dy);
            dx = baseSpeed * Math.sin(angle); dy = -baseSpeed * Math.cos(angle);
        }
    }

    function draw() {
        ctx.clearRect(0, 0, canvas.width, canvas.height);
        if (isWaiting) { drawMessage("BREAKOUT", "Tap to Start", "#00FFCC"); drawRanking(180); }
        else if (isWin) { 
            drawMessage("STAGE CLEAR!", "Tap for Next", "#00FFCC"); 
            if(hasBonus) {
                ctx.fillStyle="#FFD700"; ctx.font="bold 20px Arial"; ctx.textAlign="center"; 
                ctx.fillText("🌟 BONUS +500 🌟", canvas.width/2, 160); 
            } else { drawRanking(220); }
        }
        else if (isGameOver) { drawMessage("GAME OVER", "Score: " + score, "#FF3333"); drawRanking(220); }
        else if (isMiss) drawMessage("OOPS!", "Tap to Continue", "#FFA500");
        else { updateGame(); drawBricks(); drawBall(); drawPaddle(); drawItems(); if(oneUpTimer > 0) { ctx.font="30px Arial"; ctx.fillStyle=`rgba(255,215,0,${oneUpTimer/100})`; ctx.textAlign="center"; ctx.fillText("1-UP!", canvas.width/2, canvas.height/2); oneUpTimer--; } }
        requestAnimationFrame(draw);
    }

    function drawMessage(t, s, c) { ctx.font = "bold 32px Arial"; ctx.fillStyle = c; ctx.textAlign = "center"; ctx.fillText(t, canvas.width/2, 80); ctx.font = "16px Arial"; ctx.fillStyle = "white"; ctx.fillText(s, canvas.width/2, 120); }
    function drawRanking(y) { 
        let s = JSON.parse(localStorage.getItem("breakout_scores")) || [];
        ctx.font="bold 18px Arial"; ctx.fillStyle="#FFD700"; ctx.textAlign="center"; ctx.fillText("🏆 TOP 5 🏆", canvas.width/2, y);
        ctx.font="14px Arial"; ctx.fillStyle="white";
        if(!s.length) ctx.fillText("No records", canvas.width/2, y+25);
        else s.forEach((sc, i) => ctx.fillText(`${i+1}. ${sc} pts`, canvas.width/2, y+30+(i*22)));
    }
    function drawBall() { ctx.beginPath(); ctx.arc(x, y, ballRadius, 0, Math.PI*2); ctx.fillStyle = "#FFF"; ctx.fill(); }
    function drawPaddle() { ctx.fillStyle = (paddleWidth > defaultPaddleWidth) ? "#0cf" : (paddleWidth < defaultPaddleWidth ? "#a4f" : "#0fc"); ctx.fillRect(paddleX, canvas.height-30, paddleWidth, 10); }
    function drawBricks() { bricks.forEach((col, c) => col.forEach((b, r) => { if(b.status==1) { b.x=c*(bWidth+10)+20; b.y=r*(bHeight+10)+50; ctx.fillStyle=b.color; ctx.fillRect(b.x, b.y, bWidth, bHeight); } })); }
    function drawItems() { items.forEach(item => { ctx.fillStyle=item.color; ctx.beginPath(); ctx.arc(item.x, item.y, 10, 0, Math.PI*2); ctx.fill(); ctx.fillStyle="white"; ctx.font="12px Arial"; ctx.textAlign="center"; ctx.fillText(item.type[0], item.x, item.y+5); }); }
    
    function updateUI() { 
        document.getElementById("stageNum").textContent = stage; 
        document.getElementById("scoreNum").textContent = score; 
        document.getElementById("livesNum").textContent = "❤️×" + Math.max(0, lives); 
    }

    function saveScore(ns) { if(!ns)return; let s=JSON.parse(localStorage.getItem("breakout_scores"))||[]; s.push(ns); s.sort((a,b)=>b-a); localStorage.setItem("breakout_scores", JSON.stringify(s.slice(0,5))); }
    function handleAction() { if(isWaiting||isGameOver) initGame(false); else if(isWin) initGame(true); else if(isMiss){ isMiss=false; resetBallAndPaddle(); } }
    
    // PC操作
    canvas.addEventListener("click", (e) => { e.preventDefault(); handleAction(); });
    window.addEventListener("keydown", e=>{ if(e.code==="Space") handleAction(); if(e.code==="ArrowRight") rightPressed=true; if(e.code==="ArrowLeft") leftPressed=true; });
    window.addEventListener("keyup", e=>{ if(e.code==="ArrowRight") rightPressed=false; if(e.code==="ArrowLeft") leftPressed=false; });
    document.addEventListener("mousemove", e=>{ 
        let r=canvas.getBoundingClientRect(); 
        let scaleX = canvas.width / r.width; // 画面サイズが変わっても正確に位置を取得
        paddleX = Math.max(0, Math.min(canvas.width-paddleWidth, (e.clientX-r.left) * scaleX - paddleWidth/2)); 
    });

    // ★ スマホ操作対応
    canvas.addEventListener("touchstart", (e) => {
        e.preventDefault();
        if(isWaiting || isWin || isGameOver || isMiss) handleAction();
    }, {passive: false});

    canvas.addEventListener("touchmove", (e) => {
        e.preventDefault();
        let r = canvas.getBoundingClientRect();
        let scaleX = canvas.width / r.width;
        let touchX = e.touches[0].clientX;
        paddleX = Math.max(0, Math.min(canvas.width - paddleWidth, (touchX - r.left) * scaleX - paddleWidth / 2));
    }, {passive: false});

    firstLoad();
    draw();
</script>
</body>
</html>
